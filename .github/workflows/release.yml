name: Release

# Native deps (native-sound-mixer, sharp, node-screenshots, @nut-tree-fork/
# nut-js) ship prebuilt binaries per platform/arch — building on the actual
# target OS avoids cross-compile headaches, hence windows-latest rather than
# building a Windows target from a Linux runner.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npm run build

      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=$(gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="${{ github.ref_name }}" --jq .body)
          gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --notes "$notes"

  release-android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode release keystore
        working-directory: android
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Renamed (not just labeled — gh release upload's #label only sets
        # a display name, the actual asset filename still comes from the
        # local file) to a fixed name so the desktop app's QR code
        # (MobileAppModal.tsx) can link to the stable
        # releases/latest/download/boarderoni-latest.apk redirect — that URL
        # shape matches on the real filename and can't wildcard a version in
        # it. The release's own title/tag already shows which version this
        # is, so nothing is lost by not versioning the filename too.
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk /tmp/boarderoni-latest.apk
          gh release upload "${{ github.ref_name }}" \
            /tmp/boarderoni-latest.apk \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Un-drafts the one release electron-builder + this job have been
        # uploading every asset to (see electron-builder.yml's own comment
        # on why draft has to stay the config default) — only now, once
        # every asset from both jobs has actually landed on it, so it never
        # goes public partially-populated.
        run: |
          release_id=$(gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" --jq .id)
          gh api "repos/${{ github.repository }}/releases/$release_id" -X PATCH -F draft=false
